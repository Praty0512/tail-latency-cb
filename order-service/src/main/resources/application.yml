spring:
  application:
    name: order-service
  jackson:
    mapper:
      accept-case-insensitive-enums: true   # "system": "adaptive" in /admin/config

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}

app:
  work-iterations: ${WORK_ITERATIONS:50000}

downstream:
  inventory:
    url: ${INVENTORY_URL:http://localhost:8081}
  payment:
    url: ${PAYMENT_URL:http://localhost:8082}
  hard-timeout-ms: ${DOWNSTREAM_HARD_TIMEOUT_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
